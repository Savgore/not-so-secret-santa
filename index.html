<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Not So Secret Santa</title>
    <link rel="stylesheet" href="static/style.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Mountains+of+Christmas:wght@700&family=Roboto:wght@400;500&display=swap"
        rel="stylesheet">
</head>

<body>
    <div class="container">
        <header>
            <h1>🎅 Not So Secret Santa 🎄</h1>
            <p>Generate your Secret Santa ring with custom rules!</p>
        </header>

        <main id="app">
            <div class="input-section">
                <div class="card">
                    <h2>Participants</h2>
                    <div id="participants-list">
                        <!-- Participant inputs will go here -->
                        <div class="input-group">
                            <input type="text" placeholder="Name" class="participant-name">
                            <button class="btn-remove" onclick="removeParticipant(this)">×</button>
                        </div>
                        <div class="input-group">
                            <input type="text" placeholder="Name" class="participant-name">
                            <button class="btn-remove" onclick="removeParticipant(this)">×</button>
                        </div>
                        <div class="input-group">
                            <input type="text" placeholder="Name" class="participant-name">
                            <button class="btn-remove" onclick="removeParticipant(this)">×</button>
                        </div>
                    </div>
                    <button class="btn-add" onclick="addParticipant()">+ Add Participant</button>
                </div>

                <div class="card">
                    <h2>Constraints (Optional)</h2>
                    <div id="constraints-list">
                        <!-- Constraints will go here -->
                    </div>
                    <button class="btn-add" onclick="addConstraint()">+ Add Constraint</button>
                </div>

                <button class="btn-generate" onclick="generatePairings()">Generate Pairings 🎁</button>
                <div id="error-message" class="error"></div>
            </div>

            <div id="results-section" class="hidden">
                <h2>The Circle of Giving</h2>

                <div class="export-section">
                    <h3>Copy & Paste from here (or Import)</h3>
                    <textarea id="markdown-output"
                        placeholder="Paste configuration here (e.g. Name A -> Name B)"></textarea>
                    <div class="button-row">
                        <button class="btn-copy" onclick="copyMarkdown()">Copy to Clipboard</button>
                        <button class="btn-import" onclick="importConfiguration()">Import Configuration</button>
                    </div>
                </div>

                <div id="pairs-list" class="pairs-container"></div>
                <div id="graph-container"></div>
                <div class="action-buttons">
                    <button class="btn-shuffle" onclick="generatePairings()">🔀 Shuffle</button>
                    <!-- Start Over button removed as it's no longer needed in single page view -->
                </div>
            </div>
        </main>
        <div id="snow-container"></div>
    </div>

    <script src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
    <script src="static/logic.js"></script>
    <script>
        let network = null;
        let currentPairs = [];

        function addParticipant() {
            const div = document.createElement('div');
            div.className = 'input-group';
            div.innerHTML = `
                <input type="text" placeholder="Name" class="participant-name">
                <button class="btn-remove" onclick="removeParticipant(this)">×</button>
            `;
            document.getElementById('participants-list').appendChild(div);
            updateConstraintDropdowns();
        }

        function removeParticipant(btn) {
            btn.parentElement.remove();
            updateConstraintDropdowns();
        }

        function addConstraint() {
            const div = document.createElement('div');
            div.className = 'constraint-group';
            div.innerHTML = `
                <select class="giver-select"></select>
                <select class="type-select">
                    <option value="must">MUST give to</option>
                    <option value="must_not">MUST NOT give to</option>
                </select>
                <select class="receiver-select"></select>
                <button class="btn-remove" onclick="this.parentElement.remove()">×</button>
            `;
            document.getElementById('constraints-list').appendChild(div);
            updateConstraintDropdowns(div);
        }

        function updateConstraintDropdowns(specificRow = null) {
            const names = Array.from(document.querySelectorAll('.participant-name'))
                .map(i => i.value.trim())
                .filter(n => n);

            const rows = specificRow ? [specificRow] : document.querySelectorAll('.constraint-group');

            rows.forEach(row => {
                const giverSelect = row.querySelector('.giver-select');
                const receiverSelect = row.querySelector('.receiver-select');

                const currentGiver = giverSelect.value;
                const currentReceiver = receiverSelect.value;

                giverSelect.innerHTML = '<option value="">Select Giver</option>';
                receiverSelect.innerHTML = '<option value="">Select Receiver</option>';

                names.forEach(name => {
                    giverSelect.add(new Option(name, name, false, name === currentGiver));
                    receiverSelect.add(new Option(name, name, false, name === currentReceiver));
                });
            });
        }

        // Update dropdowns when names change
        document.getElementById('participants-list').addEventListener('input', (e) => {
            if (e.target.classList.contains('participant-name')) {
                updateConstraintDropdowns();
            }
        });

        async function generatePairings() {
            const names = Array.from(document.querySelectorAll('.participant-name'))
                .map(i => i.value.trim())
                .filter(n => n);

            const constraints = Array.from(document.querySelectorAll('.constraint-group')).map(row => ({
                giver: row.querySelector('.giver-select').value,
                type: row.querySelector('.type-select').value,
                receiver: row.querySelector('.receiver-select').value
            })).filter(c => c.giver && c.receiver);

            const errorDiv = document.getElementById('error-message');
            errorDiv.textContent = '';

            try {
                // Call client-side logic instead of fetch
                if (names.length < 2) {
                    throw new Error("Need at least 2 participants");
                }

                const pairs = solveSecretSanta(names, constraints);

                if (!pairs) {
                    throw new Error("No valid solution found with these constraints!");
                }

                currentPairs = pairs;
                displayResults(currentPairs);

            } catch (e) {
                errorDiv.textContent = e.message;
            }
        }

        function displayResults(pairs) {
            // Ensure results section is visible (remove hidden class if present)
            document.getElementById('results-section').classList.remove('hidden');
            // Input section remains visible now

            const listContainer = document.getElementById('pairs-list');
            listContainer.innerHTML = '';

            // Generate Markdown
            let markdownText = "";

            pairs.forEach((pair, index) => {
                // Add to text list
                const item = document.createElement('div');
                item.className = 'pair-item';
                item.innerHTML = `<strong>${pair.giver.name}</strong> ➔ <strong>${pair.receiver.name}</strong>`;
                listContainer.appendChild(item);

                // Add to markdown
                markdownText += `${pair.giver.name} -> ${pair.receiver.name}\n`;
            });

            document.getElementById('markdown-output').value = markdownText.trim();

            const nodes = [];
            const edges = [];

            pairs.forEach((pair, index) => {
                // Add nodes if not exists (though all should exist)
                if (!nodes.find(n => n.id === pair.giver.name)) {
                    nodes.push({
                        id: pair.giver.name,
                        label: pair.giver.name,
                        shape: 'image',
                        image: pair.giver.avatar,
                        size: 30
                    });
                }
                // Edges
                edges.push({
                    from: pair.giver.name,
                    to: pair.receiver.name,
                    arrows: 'to',
                    color: { color: '#d32f2f' },
                    width: 2
                });
            });

            const container = document.getElementById('graph-container');
            const data = { nodes: new vis.DataSet(nodes), edges: new vis.DataSet(edges) };
            const options = {
                physics: {
                    stabilization: false,
                    barnesHut: {
                        springLength: 200
                    }
                },
                layout: {
                    randomSeed: 2
                },
                interaction: {
                    dragNodes: true
                }
            };

            network = new vis.Network(container, data, options);

            // Add Drag and Drop Swap Logic
            network.on("dragEnd", function (params) {
                if (params.nodes.length > 0) {
                    const draggedNodeId = params.nodes[0];
                    const pointer = params.pointer.DOM;
                    const nodeAtPointer = network.getNodeAt(pointer);

                    if (nodeAtPointer && nodeAtPointer !== draggedNodeId) {
                        // Swap logic
                        swapNodes(draggedNodeId, nodeAtPointer);
                    }
                }
            });
        }

        function swapNodes(nodeA, nodeB) {
            // Reconstruct ring from currentPairs
            // currentPairs is [{giver: {name, avatar}, receiver: {name, avatar}}]
            // Convert to simple map for traversal
            const map = {};
            const avatarMap = {};
            currentPairs.forEach(p => {
                map[p.giver.name] = p.receiver.name;
                avatarMap[p.giver.name] = p.giver.avatar;
                avatarMap[p.receiver.name] = p.receiver.avatar;
            });

            // Build ring array
            const ring = [];
            let current = currentPairs[0].giver.name;
            const start = current;

            // Safety break in case of infinite loop (shouldn't happen with valid ring)
            let count = 0;
            do {
                ring.push(current);
                current = map[current];
                count++;
            } while (current !== start && count < currentPairs.length + 1);

            // Swap indices of nodeA and nodeB in the ring
            const idxA = ring.indexOf(nodeA);
            const idxB = ring.indexOf(nodeB);

            if (idxA !== -1 && idxB !== -1) {
                [ring[idxA], ring[idxB]] = [ring[idxB], ring[idxA]];

                // Rebuild pairs from new ring
                const newPairs = [];
                for (let i = 0; i < ring.length; i++) {
                    const giverName = ring[i];
                    const receiverName = ring[(i + 1) % ring.length];
                    newPairs.push({
                        giver: { name: giverName, avatar: avatarMap[giverName] },
                        receiver: { name: receiverName, avatar: avatarMap[receiverName] }
                    });
                }

                currentPairs = newPairs;
                displayResults(currentPairs);
            }
        }

        function reset() {
            // In single page mode, reset might just clear the results?
            // Or maybe clear inputs? 
            // Let's just clear results for now.
            document.getElementById('results-section').classList.add('hidden');
            currentPairs = [];
        }

        function copyMarkdown() {
            const copyText = document.getElementById("markdown-output");
            copyText.select();
            copyText.setSelectionRange(0, 99999); /* For mobile devices */
            navigator.clipboard.writeText(copyText.value);

            const btn = document.querySelector('.btn-copy');
            const originalText = btn.textContent;
            btn.textContent = "Copied!";
            setTimeout(() => btn.textContent = originalText, 2000);
        }

        function importConfiguration() {
            const text = document.getElementById('markdown-output').value;
            if (!text.trim()) return;

            const lines = text.split('\n');
            const newPairs = [];
            const participants = new Set();

            // Regex to match "Name A -> Name B"
            // Allowing for some flexibility in spacing
            const regex = /(.+?)\s*->\s*(.+)/;

            for (const line of lines) {
                if (!line.trim()) continue;
                const match = line.match(regex);
                if (match) {
                    const giverName = match[1].trim();
                    const receiverName = match[2].trim();

                    participants.add(giverName);
                    participants.add(receiverName);

                    newPairs.push({
                        giver: {
                            name: giverName,
                            avatar: `https://api.dicebear.com/9.x/thumbs/svg?seed=${giverName}`
                        },
                        receiver: {
                            name: receiverName,
                            avatar: `https://api.dicebear.com/9.x/thumbs/svg?seed=${receiverName}`
                        }
                    });
                }
            }

            if (newPairs.length === 0) {
                alert("No valid pairings found. Format should be: Name A -> Name B");
                return;
            }

            // Update Participants List UI
            const listDiv = document.getElementById('participants-list');
            listDiv.innerHTML = ''; // Clear existing

            participants.forEach(name => {
                const div = document.createElement('div');
                div.className = 'input-group';
                div.innerHTML = `
                    <input type="text" placeholder="Name" class="participant-name" value="${name}">
                    <button class="btn-remove" onclick="removeParticipant(this)">×</button>
                `;
                listDiv.appendChild(div);
            });

            updateConstraintDropdowns();

            // Update Results
            currentPairs = newPairs;
            displayResults(currentPairs);

            // Keep the text in the textarea (displayResults overwrites it, so we might need to restore it or just let displayResults regenerate it)
            // displayResults regenerates it, which is fine as it normalizes the format.
        }

        // Snow Effect
        function createSnowflake() {
            const snowflake = document.createElement('div');
            snowflake.classList.add('snowflake');
            snowflake.textContent = '❄';
            snowflake.style.left = Math.random() * 100 + 'vw';
            snowflake.style.animationDuration = Math.random() * 3 + 2 + 's'; // 2-5s
            snowflake.style.opacity = Math.random();
            snowflake.style.fontSize = Math.random() * 10 + 10 + 'px';

            document.getElementById('snow-container').appendChild(snowflake);

            setTimeout(() => {
                snowflake.remove();
            }, 5000);
        }

        setInterval(createSnowflake, 100);
    </script>
</body>

</html>
